<h1>jPrime admin API</h1>
<p>The React admin UI is not bundled into this build.</p>
<ul>
    <li>Development: <code>cd admin-ui &amp;&amp; npm install &amp;&amp; npm run dev</code> and open
        <a href="http://localhost:5173">http://localhost:5173</a></li>
    <li>Single jar with the UI: <code>mvn package -Pbundle-ui</code></li>
    <li>API documentation (dev mode): <a href="/q/swagger-ui">/q/swagger-ui</a></li>
</ul>
</body>
