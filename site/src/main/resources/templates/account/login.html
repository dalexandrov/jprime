{#include base}
{#title}jPrime | Login{/title}
<h1>Login</h1>
{#if error}<div class="alert error">{error}</div>{/if}
<form method="post" action="/j_security_check">
    <div class="field"><label for="j_username">E-mail</label><input type="text" id="j_username" name="j_username" required></div>
    <div class="field"><label for="j_password">Password</label><input type="password" id="j_password" name="j_password" required></div>
    <p><button type="submit">Login</button></p>
</form>
<p><a href="/account/reset-password">Forgot your password?</a> · <a href="/account/signup">Register</a></p>
{/include}
