<div class="card">
    <a href="/speaker/{speaker.id}"><img class="photo" src="/image/speaker/{speaker.id}" alt="{speaker.name}" loading="lazy"></a>
    <h3><a href="/speaker/{speaker.id}">{speaker.firstName ?: ''} {speaker.lastName ?: ''}</a></h3>
    {#if speaker.headline}<p class="muted">{speaker.headline}</p>{/if}
    <p>
        {#if speaker.twitterHandle}<a href="https://x.com/{speaker.twitterHandle}">X</a>{/if}
        {#if speaker.bsky}<a href="{speaker.bsky}">Bluesky</a>{/if}
    </p>
</div>
