# ======================================================================================
# jPrime public site
# Shared settings (datasource, Flyway, Hibernate, mail) come from the core module:
# core/src/main/resources/META-INF/microprofile-config.properties
# ======================================================================================
quarkus.application.name=jprime-site
quarkus.http.port=8080
quarkus.http.test-port=8091
quarkus.http.limits.max-body-size=20M
quarkus.http.body.uploads-directory=${java.io.tmpdir}/jprime-uploads

# ---- Form login for registered users (the legacy /login page) ----
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/account/login
quarkus.http.auth.form.error-page=/account/login?error=true
quarkus.http.auth.form.landing-page=/
quarkus.http.auth.form.cookie-same-site=lax
quarkus.http.auth.form.timeout=PT2H
# MUST be set in production (at least 16 characters), otherwise logins do not survive a restart
#quarkus.http.auth.session.encryption-key=change-me-to-a-long-random-string

# ---- CORS: the mobile app reads /pwa/findSessionsByHall cross-origin ----
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET

# ---- Templates ----
quarkus.qute.suffixes=html,txt

# ---- Static resources (images, the Flutter app under /app) ----
quarkus.http.static-resources.max-age=PT1H
quarkus.http.static-resources.caching-enabled=true

# ---- Agenda columns (VenueHall.name values) ----
jprime.agenda.halls=Hall A,Hall B,Workshops
jprime.agenda.hall-captions=Hall A,Hall B,Workshops & Deep Dives

# ---- Captcha: signs the expected answer; set it when running more than one instance ----
#jprime.captcha.secret=change-me

# ---- Dev mode ----
%dev.quarkus.log.category."org.bgjug".level=DEBUG

# ---- JSON (mobile app API): like the legacy app, null properties are omitted ----
quarkus.jackson.serialization-inclusion=non_null

# ---- Dev / test: a fixed key so logins survive restarts ----
%dev.quarkus.http.auth.session.encryption-key=dev-only-encryption-key-change-me
%test.quarkus.http.auth.session.encryption-key=test-only-encryption-key-change-me
