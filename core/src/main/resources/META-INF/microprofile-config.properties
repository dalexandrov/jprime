# ---------------------------------------------------------------------------------------------------------------
# Shared defaults for both applications (site and admin). Each app can override them in its application.properties
# or with environment variables (e.g. QUARKUS_DATASOURCE_PASSWORD).
# ---------------------------------------------------------------------------------------------------------------

# ---- Database: the existing jPrime MySQL schema ----
quarkus.datasource.db-kind=mysql
# dev + prod: the real MySQL (docker-compose.yml starts one locally). Override with QUARKUS_DATASOURCE_JDBC_URL etc.
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/jprime?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci
%dev.quarkus.datasource.username=root
%dev.quarkus.datasource.password=admin
%dev.quarkus.datasource.devservices.enabled=false
%prod.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/jprime?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_general_ci
%prod.quarkus.datasource.username=root
# %prod password: set QUARKUS_DATASOURCE_PASSWORD
# test: Quarkus Dev Services starts a throw-away MySQL container (needs Docker) - see the "db-tests" Maven profile
%test.quarkus.datasource.devservices.image-name=mysql:8.0
%test.quarkus.datasource.devservices.db-name=jprime
%test.quarkus.datasource.devservices.command=--character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1

# Hibernate must never change the schema - Flyway owns it
quarkus.hibernate-orm.schema-management.strategy=none
# Table/column names are exactly the entity/field names (camelCase), like the legacy app
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
quarkus.hibernate-orm.implicit-naming-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
# java.time.Duration is stored as NUMERIC nanoseconds (Branch.duration)
quarkus.hibernate-orm.unsupported-properties."hibernate.type.preferred_duration_jdbc_type"=NUMERIC
quarkus.hibernate-orm.jdbc.statement-batch-size=50
quarkus.hibernate-orm.log.sql=false

# ---- Flyway: the very same scripts/locations as before, so the existing flyway_schema_history validates ----
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.locations=db/migration/structure,db/migration/data
quarkus.flyway.default-schema=jprime

# ---- Caches ----
# The admin app invalidates its own cache immediately; the site picks up admin changes within a minute.
quarkus.cache.caffeine."current-branch".expire-after-write=60S
quarkus.cache.caffeine."ticket-prices".expire-after-write=60S

# ---- Mail ----
quarkus.mailer.from=conference@jprime.io
quarkus.mailer.host=mail.jprime.io
quarkus.mailer.port=465
quarkus.mailer.tls=true
quarkus.mailer.username=conference@jprime.io
quarkus.mailer.auth-methods=LOGIN PLAIN
# set QUARKUS_MAILER_PASSWORD in the environment
# In dev and test mode nothing is sent, mails are only logged
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
# When set, every mail goes to this address instead of the real recipient
#jprime.mail.test-address=you@example.com
jprime.mail.conference-address=conference@jprime.io

# ---- Misc ----
jprime.site-url=https://jprime.io
jprime.reset-password.url=https://jprime.io/account/new-password?tokenId=
jprime.reset-password.token-duration-hours=2
