{#include base}
{#title}jPrime | Pick a new password{/title}
<h1>Pick a new password</h1>
{#if error}<div class="alert error">{error}</div>{/if}
<form method="post" action="/account/new-password">
    <input type="hidden" name="tokenId" value="{tokenId}">
    <div class="field"><label for="password">Password *</label><input type="password" id="password" name="password" required></div>
    <div class="field"><label for="cpassword">Confirm password *</label><input type="password" id="cpassword" name="cpassword" required></div>
    <p><button type="submit">Change password</button></p>
</form>
{/include}
