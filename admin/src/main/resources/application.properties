# ======================================================================================
# jPrime admin application (REST API + React UI)
# Shared settings (datasource, Flyway, Hibernate, mail) come from the core module:
# core/src/main/resources/META-INF/microprofile-config.properties
# ======================================================================================
quarkus.application.name=jprime-admin
quarkus.http.port=8081
quarkus.http.test-port=8092
quarkus.http.limits.max-body-size=20M
quarkus.http.body.uploads-directory=${java.io.tmpdir}/jprime-admin-uploads

# ---- Who may log in (see AdminIdentityProvider) ----
jprime.admin.username=admin
# Plain text or a BCrypt hash ($2a$...). Set it with the JPRIME_ADMIN_PASSWORD environment variable!
%dev.jprime.admin.password=TestPassword
%test.jprime.admin.password=password
# Registered users (User table) that are also admins, comma separated
#jprime.admin.emails=ivan@jprime.io,mitia@jprime.io

# ---- Authentication ----
# The React UI uses form authentication without redirects (single page application mode):
#   POST /j_security_check (j_username, j_password) -> 200 + encrypted cookie, or 401
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=
quarkus.http.auth.form.landing-page=
quarkus.http.auth.form.error-page=
quarkus.http.auth.form.cookie-same-site=strict
quarkus.http.auth.form.timeout=PT8H
quarkus.http.auth.form.new-cookie-interval=PT10M
# MUST be set in production (at least 16 characters): QUARKUS_HTTP_AUTH_SESSION_ENCRYPTION_KEY
%dev.quarkus.http.auth.session.encryption-key=dev-only-encryption-key-change-me
%test.quarkus.http.auth.session.encryption-key=test-only-encryption-key-change-me
# The registration desk / mobile apps keep using HTTP Basic for the legacy /api/* endpoints
quarkus.http.auth.basic=true

quarkus.http.auth.permission.admin-api.paths=/api/admin/*
quarkus.http.auth.permission.admin-api.policy=admin
quarkus.http.auth.permission.admin-api.auth-mechanism=form

quarkus.http.auth.permission.checkin-api.paths=/api/visitor/*,/api/ticket/*,/api/speaker/*,/api/speaker
quarkus.http.auth.permission.checkin-api.policy=admin

quarkus.http.auth.policy.admin.roles-allowed=ADMIN

quarkus.http.auth.permission.public.paths=/api/auth/*,/q/health/*
quarkus.http.auth.permission.public.policy=permit

# ---- JSON: like the legacy app, null properties are omitted ----
quarkus.jackson.serialization-inclusion=non_null
quarkus.jackson.write-dates-as-timestamps=false

# ---- CORS: only needed when the UI is served from another origin (npm run dev uses a proxy instead) ----
quarkus.http.cors.enabled=false
#quarkus.http.cors.origins=https://admin.jprime.io

# ---- OpenAPI / Swagger UI (http://localhost:8081/q/swagger-ui in dev mode) ----
quarkus.smallrye-openapi.info-title=jPrime admin API

# ---- Raffle / site links ----
jprime.site-url=https://jprime.io
